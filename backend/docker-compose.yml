services:
  mongodb:
    image: mongo:latest
    container_name: my-payment-app
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
      MONGO_INITDB_DATABASE: notes-app
    volumes:
      - "mongo_data:/data/db"

volumes:
  mongo_data:
